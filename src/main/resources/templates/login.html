<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4" style="margin-top: 10vh;">
      <div class="card shadow">
        <div class="card-body p-4">
          <h3 class="text-center mb-4">Đăng Nhập Ebook</h3>

          <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Tên đăng nhập hoặc mật khẩu không chính xác.
          </div>

          <div th:if="${param.logout}" class="alert alert-success" role="alert">
            Bạn đã đăng xuất thành công.
          </div>

          <div th:if="${successMessage}" class="alert alert-success" role="alert"
               th:text="${successMessage}">
          </div>

          <form th:action="@{/login}" method="post">
            <div class="mb-3">
              <label for="username" class="form-label">Tên đăng nhập:</label>
              <input type="text" id="username" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Mật khẩu:</label>
              <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Đăng nhập</button>
            </div>
          </form>

          <hr>

          <div class="d-grid mb-2">
            <a th:href="@{/oauth2/authorization/google}" class="btn btn-danger">
              <i class="bi bi-google"></i> Đăng nhập với Google
            </a>
          </div>

          <div class="text-center">
            <span>Chưa có tài khoản? </span>
            <a th:href="@{/register}">Đăng ký ngay</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
