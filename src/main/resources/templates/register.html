<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5" style="margin-top: 10vh;">
      <div class="card shadow">
        <div class="card-body p-4">
          <h3 class="text-center mb-4">Tạo Tài Khoản Ebook</h3>

          <div th:if="${errorMessage}" class="alert alert-danger" role="alert"
               th:text="${errorMessage}">
          </div>

          <form th:action="@{/register}" th:object="${registerDto}" method="post">
            <div class="mb-3">
              <label for="username" class="form-label">Tên đăng nhập:</label>
              <input type="text" id="username" class="form-control" th:field="*{username}" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email:</label>
              <input type="email" id="email" class="form-control" th:field="*{email}" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Mật khẩu:</label>
              <input type="password" id="password" class="form-control" th:field="*{password}" required>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Đăng ký</button>
            </div>
          </form>

          <hr>

          <div class="text-center">
            <span>Đã có tài khoản? </span>
            <a th:href="@{/login}">Đăng nhập</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
