# =======================================
# C?U HÌNH K?T N?I MYSQL
# =======================================
# URL k?t n?i CSDL (s? d?ng CSDL 'ebook_store' mà b?n ?ã cung c?p)
spring.datasource.url=jdbc:mysql://localhost:3306/ebook_store

# Username và Password c?a CSDL MySQL
spring.datasource.username=root
spring.datasource.password=

# Ch? ??nh driver cho MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =======================================
# C?U HÌNH SPRING DATA JPA (Hibernate)
# =======================================
# T? ??ng c?p nh?t (update) ho?c ki?m tra (validate) CSDL d?a trên các @Entity
spring.jpa.hibernate.ddl-auto=validate

# Hi?n th? các câu l?nh SQL trong console (r?t h?u ích ?? debug)
spring.jpa.show-sql=true

# (Tùy ch?n) C?u hình ngôn ng? (dialect) c?a Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect